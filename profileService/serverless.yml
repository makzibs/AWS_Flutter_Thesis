# "org" ensures this Service is used with the correct Serverless Framework Access Key.
org: makzibs
# "service" is the name of this project. This will also be added to your AWS resource names.
service: profileService

provider:
  name: aws
  runtime: nodejs22.x
  region: eu-north-1 # You can choose the same or a different region
  httpApi:
    authorizers:
      cognitoJwt:
        type: jwt
        identitySource: $request.header.Authorization
        issuerUrl: https://cognito-idp.eu-north-1.amazonaws.com/eu-north-1_ae4S1L6Tw
        audience:
          - 4p46vv30o2nkal2g06d2dvde5n

  iamRoleStatements:
    - Effect: Allow
      Action:
        - dynamodb:PutItem
        - dynamodb:GetItem
        - dynamodb:UpdateItem
        - s3:PutObject
        - s3:GetObject
      Resource:
        - !GetAtt UserProfilesTable.Arn
        - arn:aws:s3:::myapp-user-media-eu-north-1/*
  

resources:
  Resources:
    UserProfilesTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: UserProfiles
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: userId
            AttributeType: S # String
        KeySchema:
          - AttributeName: userId
            KeyType: HASH # Partition key

functions:
  createProfile:
    handler: handlers/profile.create
    events:
      - httpApi:
          path: /profile
          method: post
          authorizer:
            name: cognitoJwt
  getProfile:
    handler: handlers/profile.get
    events:
      - httpApi:
          path: /profile
          method: get
          authorizer:
            name: cognitoJwt
  updateProfile:
    handler: handlers/profile.update
    events:
      - httpApi:
          path: /profile
          method: put
          authorizer:
            name: cognitoJwt
  getUploadUrl:
    handler: handlers/profile.getUploadUrl
    events:
      - httpApi:
          path: /profile/upload-url
          method: post
          authorizer:
            name: cognitoJwt
    environment:
      BUCKET_NAME: myapp-user-media-eu-north-1